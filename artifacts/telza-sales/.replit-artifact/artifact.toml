kind = "web"
previewPath = "/"
title = "Telza Sales"
version = "1.0.0"
id = "artifacts/telza-sales"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19784

[services.development]
run = "pnpm --filter @workspace/telza-sales run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/telza-sales", "run", "build" ]
publicDir = "artifacts/telza-sales/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19784"
BASE_PATH = "/"
